name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      OTP_VERSION: '27.3'
      ELIXIR_VERSION: '1.19.4'

    steps:
      - name: Checkout perpwalk
        uses: actions/checkout@v4
        with:
          path: perpwalk

      - name: Checkout blueprint
        uses: actions/checkout@v4
        with:
          repository: sovereign-maxi/blueprint
          path: blueprint

      - name: Checkout seer
        uses: actions/checkout@v4
        with:
          repository: sovereign-maxi/seer
          path: seer

      - name: Checkout locker
        uses: actions/checkout@v4
        with:
          repository: sovereign-maxi/locker
          path: locker

      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          repository: sovereign-maxi/vault
          path: vault

      - name: Checkout cashew
        uses: actions/checkout@v4
        with:
          repository: sovereign-maxi/cashew
          path: cashew

      - name: Checkout darks
        uses: actions/checkout@v4
        with:
          repository: sovereign-maxi/darks
          path: darks

      - name: Checkout cartel
        uses: actions/checkout@v4
        with:
          repository: sovereign-maxi/cartel
          path: cartel

      - name: Checkout locksmith
        uses: actions/checkout@v4
        with:
          repository: sovereign-maxi/locksmith
          path: locksmith

      - name: Set up Erlang / Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache mix deps + build
        uses: actions/cache@v4
        with:
          path: |
            perpwalk/deps
            perpwalk/_build
          key: mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('perpwalk/mix.lock') }}
          restore-keys: |
            mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        working-directory: perpwalk
        run: mix deps.get

      - name: Compile deps (loads rustler before cashew force-rebuild)
        working-directory: perpwalk
        run: mix deps.compile

      - name: Force-rebuild cashew NIF (dodge stale-cache rustler skip)
        working-directory: perpwalk
        run: mix deps.compile cashew --force

      - name: Check formatting
        working-directory: perpwalk
        run: mix format --check-formatted

      - name: Credo
        working-directory: perpwalk
        run: mix credo --strict

      - name: Unit tests
        working-directory: perpwalk
        run: mix test test/unit/

      - name: Integration tests
        working-directory: perpwalk
        run: mix test --only integration

      - name: Scenario tests
        working-directory: perpwalk
        run: mix test --only scenario

      - name: Dialyzer
        working-directory: perpwalk
        run: mix dialyzer --format short
